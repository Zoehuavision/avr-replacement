<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AVR 选型速查表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap">
<style>
/* Layout: 顶部标题 + 粘性搜索栏；筛选芯片；按品牌分组的功能矩阵表；右侧(手机为底部)知识点面板 */
:root{
  --bg:#F1F5EF; --surface:#FAFCF8; --surface2:#E9F0E6; --ink:#2B3A31; --muted:#66776B; --line:#D8E2D4;
  --sage:#8FB195; --sage-deep:#476F54; --sage-soft:#DCE9DA;
  --blossom:#E4B8C0; --blossom-soft:#F6E6E9; --blossom-deep:#8F4B5A;
  --sky:#BCD5DB; --sky-soft:#E3EEF1; --butter:#EFE3B5;
  --hover:#EAF2E6; --bar:rgba(241,245,239,.88); --shadow:0 10px 34px rgba(58,90,68,.16);
  --glow1:rgba(228,184,192,.30); --glow2:rgba(143,177,149,.26);
  --tip-bg:#34483C; --tip-fg:#F3F7F1;
  --f-display:"Noto Serif SC","Songti SC","STSong",serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151B18; --surface:#1D2520; --surface2:#243029; --ink:#E3EBE4; --muted:#9AAC9F; --line:#2F3D34;
    --sage:#6F9478; --sage-deep:#A9D0B2; --sage-soft:#2A3A30;
    --blossom:#9C6F79; --blossom-soft:#3A2B2F; --blossom-deep:#E8B9C2;
    --sky:#4F7079; --sky-soft:#223238; --butter:#8A7F4A;
    --hover:#26332B; --bar:rgba(21,27,24,.88); --shadow:0 10px 34px rgba(0,0,0,.45);
    --glow1:rgba(156,111,121,.16); --glow2:rgba(111,148,120,.16);
    --tip-bg:#DCE8DE; --tip-fg:#1B2A21; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151B18; --surface:#1D2520; --surface2:#243029; --ink:#E3EBE4; --muted:#9AAC9F; --line:#2F3D34;
  --sage:#6F9478; --sage-deep:#A9D0B2; --sage-soft:#2A3A30;
  --blossom:#9C6F79; --blossom-soft:#3A2B2F; --blossom-deep:#E8B9C2;
  --sky:#4F7079; --sky-soft:#223238; --butter:#8A7F4A;
  --hover:#26332B; --bar:rgba(21,27,24,.88); --shadow:0 10px 34px rgba(0,0,0,.45);
  --glow1:rgba(156,111,121,.16); --glow2:rgba(111,148,120,.16);
  --tip-bg:#DCE8DE; --tip-fg:#1B2A21; color-scheme:dark;
}
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:radial-gradient(900px 420px at 92% -6%,var(--glow1),transparent 70%),radial-gradient(780px 460px at -8% 30%,var(--glow2),transparent 70%);background-repeat:no-repeat;color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6}
button{font:inherit;color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px}

/* hero */
.hero{position:relative;padding-block:34px 18px}
.hero h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,5vw,44px);line-height:1.2;margin:0 0 10px;letter-spacing:.04em;text-wrap:balance}
.hero p{margin:0;max-width:34em;color:var(--muted);font-size:15px}
.sprig{position:absolute;right:0;top:6px;width:min(230px,34vw);height:auto;pointer-events:none}
.hints{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:18px;color:var(--muted);font-size:13px}
.hint{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;cursor:pointer;font-family:var(--f-mono);font-size:12.5px}
.hint:hover{border-color:var(--sage);color:var(--sage-deep)}

/* search bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-block:10px}
.sbox-wrap{position:relative;max-width:640px}
.sbox{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:0 8px 0 16px;height:48px;box-shadow:0 2px 12px rgba(58,90,68,.08);transition:border-color .15s,box-shadow .15s}
.sbox:focus-within{border-color:var(--sage);box-shadow:0 0 0 4px var(--sage-soft)}
.sbox svg{flex:none;color:var(--muted)}
.sbox input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:15px;height:100%}
.sbox input::placeholder{color:var(--muted)}
.xbtn{border:0;background:var(--surface2);color:var(--muted);width:30px;height:30px;border-radius:50%;cursor:pointer;display:grid;place-items:center;flex:none}
.xbtn:hover{color:var(--ink)}
.dd{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:6px;max-height:min(70vh,420px);overflow:auto}
.dd .lab{font-size:11.5px;color:var(--muted);padding:6px 10px 2px;letter-spacing:.06em}
.sug{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:12px;cursor:pointer}
.sug:hover,.sug.act{background:var(--hover)}
.sug .nm{font-family:var(--f-mono);font-weight:500}
.sug .br{color:var(--muted);font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sug .why{margin-left:auto;font-size:11.5px;color:var(--sage-deep);background:var(--sage-soft);border-radius:999px;padding:1px 8px;white-space:nowrap}
.dd .none{padding:14px;color:var(--muted)}

/* filters */
.filters{display:flex;flex-direction:column;gap:10px;padding-block:14px 6px}
.frow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.frow .lbl{font-size:12.5px;color:var(--muted);margin-right:4px;letter-spacing:.04em}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 13px;cursor:pointer;font-size:13px;transition:background .15s,border-color .15s}
.fchip:hover{border-color:var(--sage)}
.fchip.on{background:var(--sage-soft);border-color:var(--sage);color:var(--sage-deep);font-weight:500}
.fchip.sp.on{background:var(--blossom-soft);border-color:var(--blossom);color:var(--blossom-deep)}
.fchip small{color:var(--muted);margin-left:4px;font-size:11.5px}
.status{display:flex;gap:14px;align-items:center;color:var(--muted);font-size:12.5px;padding-block:6px 4px}
.clear{border:0;background:none;color:var(--sage-deep);cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:0}

/* brand sections */
.brand{margin-block:22px 8px}
.bhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:10px}
.bhead h2{margin:0;font-family:var(--f-display);font-size:21px;font-weight:600;display:flex;align-items:center;gap:10px}
.bhead h2 i{width:12px;height:12px;border-radius:50%;display:inline-block}
.bhead .cnt{color:var(--muted);font-size:12.5px}
.bhead .ap{color:var(--muted);font-size:13px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:0 2px 14px rgba(58,90,68,.06)}
table{border-collapse:separate;border-spacing:0;min-width:1190px;width:100%;font-size:13.5px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:center;background:var(--surface)}
thead th{background:var(--surface2);color:var(--muted);font-weight:500;font-size:12px;line-height:1.35}
thead th.gb{background:var(--sage-soft);color:var(--sage-deep);letter-spacing:.2em}
thead th.gs{background:var(--blossom-soft);color:var(--blossom-deep);letter-spacing:.2em}
th.f{width:48px;min-width:48px;padding:8px 2px;cursor:help}
th.f:hover{background:var(--hover);color:var(--ink)}
th.h{cursor:help}
.model{position:sticky;left:0;z-index:2;text-align:left;min-width:132px;box-shadow:1px 0 0 var(--line)}
thead th.model{z-index:3}
tbody tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer;scroll-margin-top:100px}
tbody tr:hover td{background:var(--hover)}
tbody tr.sel td{background:var(--sage-soft)}
.mname{border:0;background:none;padding:0;cursor:pointer;font-family:var(--f-mono);font-weight:500;font-size:14px;color:var(--ink);text-align:left}
tbody tr:hover .mname{color:var(--sage-deep)}
td.num{white-space:nowrap;font-variant-numeric:tabular-nums}
td.subs{text-align:left;min-width:150px}
td.rm{text-align:left;min-width:170px;color:var(--muted);font-size:12.5px;line-height:1.5}
.na{color:var(--muted);opacity:.55}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-family:var(--f-mono);font-size:12px;padding:1px 9px;border-radius:999px;background:var(--sky-soft);border:1px solid transparent;color:var(--ink);cursor:default}
.chip.known{cursor:pointer}
.chip.known:hover{border-color:var(--sky)}
.chip.unk{background:transparent;border:1px dashed var(--line);color:var(--muted);font-family:var(--f-body)}
.dot{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid;font-size:11px;font-weight:500;transition:transform .15s;outline-offset:2px}
.dot:hover,.dot:focus-visible{transform:scale(1.2)}
.dot.basic{background:var(--sage-soft);border-color:var(--sage);color:var(--sage-deep)}
.dot.special{background:var(--blossom-soft);border-color:var(--blossom);color:var(--blossom-deep)}
.dot.pill{width:auto;padding:0 7px;border-radius:11px;white-space:nowrap}
.empty{padding:40px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px;margin-top:18px}
.foot{color:var(--muted);font-size:12.5px;padding-block:22px 40px}

/* tooltip */
.tip{position:fixed;z-index:60;max-width:270px;background:var(--tip-bg);color:var(--tip-fg);padding:9px 12px;border-radius:12px;font-size:12.5px;line-height:1.55;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;box-shadow:var(--shadow)}
.tip.show{opacity:1;transform:none}
.tip b{display:block;font-size:13px;margin-bottom:2px}

/* knowledge panel */
.panel{position:fixed;z-index:25;right:16px;top:84px;bottom:16px;width:min(410px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:auto;transform:translateX(calc(100% + 40px));opacity:0;visibility:hidden;transition:transform .28s ease,opacity .2s,visibility .28s}
.panel.open{transform:none;opacity:1;visibility:visible}
.pin{padding:20px 20px 24px}
.ph{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.06em}
.ph h3{margin:2px 0 0;font-family:var(--f-mono);font-size:26px;font-weight:500;overflow-wrap:anywhere}
.ph h3.sf{font-family:var(--f-display);font-weight:700;font-size:24px}
.spec{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-block:16px 4px}
.spec div{background:var(--surface2);border-radius:14px;padding:9px 10px;min-width:0}
.spec span{display:block;font-size:11.5px;color:var(--muted)}
.spec b{font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pin h4{margin:20px 0 8px;font-size:13px;font-weight:700;color:var(--sage-deep);letter-spacing:.06em}
.pin h4.sp{color:var(--blossom-deep)}
.pin p{margin:0}
.flist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.flist li{border-radius:14px;padding:10px 12px;background:var(--sage-soft)}
.flist li.sp{background:var(--blossom-soft)}
.flist button{border:0;background:none;padding:0;cursor:pointer;font-weight:500;text-align:left}
.flist button:hover{text-decoration:underline;text-underline-offset:3px}
.flist small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.55}
.dl{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.mut{display:flex;flex-wrap:wrap;gap:6px}
.mut span{border:1px dashed var(--line);border-radius:999px;padding:1px 10px;color:var(--muted);font-size:12.5px;cursor:help}
.note{font-size:12px;color:var(--muted);margin-top:18px}
.chips.big .chip{font-size:13px;padding:3px 11px}
.pgroup{margin-bottom:10px}
.pgroup .eyebrow{margin-bottom:4px}

@media (max-width:760px){
  .hero{padding-block:22px 10px}
  .panel{left:0;right:0;top:auto;bottom:0;width:auto;max-height:74vh;border-radius:22px 22px 0 0;transform:translateY(105%)}
  .panel.open{transform:none}
  .sprig{opacity:.55;width:120px}
  .sug .why{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="fl">
      <ellipse cx="0" cy="-8" rx="5.5" ry="8.5" style="fill:var(--blossom)"/>
      <ellipse cx="0" cy="-8" rx="5.5" ry="8.5" transform="rotate(72)" style="fill:var(--blossom)"/>
      <ellipse cx="0" cy="-8" rx="5.5" ry="8.5" transform="rotate(144)" style="fill:var(--blossom)"/>
      <ellipse cx="0" cy="-8" rx="5.5" ry="8.5" transform="rotate(216)" style="fill:var(--blossom)"/>
      <ellipse cx="0" cy="-8" rx="5.5" ry="8.5" transform="rotate(288)" style="fill:var(--blossom)"/>
      <circle r="3.2" style="fill:var(--butter)"/>
    </g>
  </defs>
</svg>

<div class="wrap">
  <header class="hero">
    <svg class="sprig" viewBox="0 0 240 150" aria-hidden="true">
      <path d="M8 142 C58 124 92 94 130 72 S204 32 234 12" fill="none" style="stroke:var(--sage)" stroke-width="3" stroke-linecap="round"/>
      <path d="M62 118 C70 100 84 96 92 98" fill="none" style="stroke:var(--sage)" stroke-width="2" stroke-linecap="round"/>
      <path d="M140 66 C150 52 162 50 172 54" fill="none" style="stroke:var(--sage)" stroke-width="2" stroke-linecap="round"/>
      <ellipse cx="40" cy="126" rx="13" ry="5.5" transform="rotate(-24 40 126)" style="fill:var(--sage-soft);stroke:var(--sage)"/>
      <ellipse cx="118" cy="92" rx="13" ry="5.5" transform="rotate(-38 118 92)" style="fill:var(--sage-soft);stroke:var(--sage)"/>
      <ellipse cx="176" cy="58" rx="12" ry="5" transform="rotate(-30 176 58)" style="fill:var(--sage-soft);stroke:var(--sage)"/>
      <use href="#fl" transform="translate(94 96) rotate(10) scale(1.05)"/>

      <circle cx="18" cy="136" r="3.5" style="fill:var(--blossom)"/>
    </svg>
    <h1>AVR 选型速查表</h1>
    <p>7 个品牌的自动电压调节器（AVR），按电流、功率、可代替型号和功能对照。鼠标悬停看说明，搜索型号直接查看相关知识点。</p>
    <div class="hints"><span>试试搜索</span>
      <button class="hint" data-hint="SX440">SX440</button>
      <button class="hint" data-hint="R450">R450</button>
      <button class="hint" data-hint="EA16">EA16</button>
      <button class="hint" data-hint="PMG">PMG</button>
      <button class="hint" data-hint="铁路">铁路</button>
    </div>
  </header>
</div>

<div class="bar">
  <div class="wrap">
    <div class="sbox-wrap" id="sw">
      <div class="sbox">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="搜索型号、品牌或功能，如 SX440、R450、过励磁" aria-label="搜索型号">
        <button class="xbtn" id="qx" hidden aria-label="清除搜索"><svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 2l8 8M10 2l-8 8"/></svg></button>
      </div>
      <div class="dd" id="dd" role="listbox" hidden></div>
    </div>
  </div>
</div>

<main class="wrap">
  <div class="filters">
    <div class="frow" id="brandRow"></div>
    <div class="frow" id="featRow"></div>
  </div>
  <div class="status"><span id="count" aria-live="polite"></span><button class="clear" id="clear" hidden>清除全部筛选</button></div>
  <div id="sections"></div>
  <p class="foot">数据来自上传的 AVR 选型表，“—”表示表中未标注。功能说明为通用解释，具体参数请以厂家资料为准。</p>
</main>

<aside class="panel" id="panel" aria-hidden="true" aria-label="知识点"></aside>
<div class="tip" id="tip" role="tooltip"></div>

<script>
const FEATS=[
 {k:'ufro',g:'b',n:'低频保护',s:'低频<br>保护',d:'发动机转速（频率）低于设定拐点时，调压器自动按比例降低输出电压，减轻发动机负担，让转速更快恢复，同时防止励磁过大。'},
 {k:'remote',g:'b',n:'外接电压调节',s:'外接<br>电压调节',d:'可在机组外部接一个电位器，远程微调输出电压，现场整定更方便。'},
 {k:'range',g:'b',n:'电压范围选择',s:'电压范围<br>选择',d:'可通过跳线或拨码切换电压采样范围，一款调压器适配多种电压等级。'},
 {k:'size',g:'b',n:'大小功率选择',s:'大小功率<br>选择',d:'可按机组容量大小切换对应档位，让调压的稳定性与响应速度更贴合机组。'},
 {k:'parallel',g:'b',n:'并机无功调节',s:'并机无功<br>调节',d:'多台机组并联运行时，通过电流互感器信号做无功下垂调节，使各台机组均分无功功率。'},
 {k:'pmg',g:'s',n:'支持PMG',s:'支持<br>PMG',d:'可由永磁副励磁机（PMG）供电，励磁电源独立于主输出，带载冲击和短路时仍能提供较强的励磁能力。'},
 {k:'aux',g:'s',n:'并机辅助输入',s:'并机辅助<br>输入',d:'预留辅助信号输入端，可接并机、同步或外部控制模块的信号，参与调压。'},
 {k:'overex',g:'s',n:'过励磁保护',s:'过励磁<br>保护',d:'励磁电流过大并持续一段时间后，自动降低或切断励磁，保护励磁绕组和调压器不过热。'},
 {k:'soft',g:'s',n:'缓起动功能',s:'缓起动<br>功能',d:'启动时输出电压按斜坡缓慢建立，避免电压冲击和过冲。'},
 {k:'overv',g:'s',n:'过电压保护',s:'过电压<br>保护',d:'输出电压异常升高时自动切断励磁，保护负载和发电机。'},
 {k:'sense3',g:'s',n:'3相电压检测',s:'3相电压<br>检测',d:'同时采样三相电压，而不是只看单相，三相不平衡时调压更准确。'},
 {k:'power3',g:'s',n:'3相电源',s:'3相<br>电源',d:'调压器工作电源取自三相，供电更稳定。'}

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().replace(/[\s\-_.,，、]/g,'');
const ALL=[],MAP=new Map(),BYN=new Map();
BR.forEach(b=>b.models.forEach(m=>{m.brand=b;m.key=b.id+':'+m.n;m.f=m.f||[];m.subs=m.subs||[];m.ap=m.ap||b.ap;ALL.push(m);MAP.set(m.key,m);BYN.set(norm(m.n),m);}));
const state={brand:'all',feats:new Set(),q:'',sel:null};
const CHECK='<svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.4l2.3 2.3 4.7-5"/></svg>';

/* ---------- search ---------- */
function score(m,q){
  const nq=norm(q); if(!nq) return {s:1,why:''};
  const nn=norm(m.n);
  if(nn===nq) return {s:100,why:'型号匹配'};
  if(nn.startsWith(nq)) return {s:80,why:'型号开头'};
  if(nn.includes(nq)) return {s:60,why:'型号包含'};
  const sub=m.subs.find(x=>norm(x).includes(nq)); if(sub) return {s:40,why:'可代替 '+sub};
  const fe=FEATS.find(f=>m.f.includes(f.k)&&norm(f.n).includes(nq)); if(fe) return {s:35,why:fe.n};
  if(norm(m.brand.name).includes(nq)) return {s:25,why:'品牌'};
  if([m.ap,m.rm,m.cur,m.pw].some(x=>norm(x).includes(nq))) return {s:20,why:'备注/参数'};
  return {s:0,why:''};
}
function results(){
  const q=state.q.trim(); if(!q) return [];
  return ALL.map((m,i)=>({m,i,...score(m,q)})).filter(r=>r.s>0).sort((a,b)=>b.s-a.s||a.i-b.i);
}

/* ---------- render ---------- */
function rowHTML(m){
  const dots=FEATS.map(f=>{
    if(!m.f.includes(f.k)) return '<td></td>';
    const lv=m.lv&&m.lv[f.k];
    return `<td><span class="dot ${f.g==='b'?'basic':'special'}${lv?' pill':''}" tabindex="0" data-tt="d|${esc(m.key)}|${f.k}">${lv?esc(lv):CHECK}</span></td>`;
  }).join('');
  const subs=m.subs.length?`<div class="chips">${m.subs.map(s=>{const k=BYN.get(norm(s));return k?`<span class="chip known" data-sub="${esc(k.key)}" data-tt="m|${esc(k.key)}">${esc(s)}</span>`:`<span class="chip unk" data-tt="u|${esc(s)}">${esc(s)}</span>`}).join('')}</div>`:(m.noSub?'无':'<span class="na">—</span>');
  return `<tr data-m="${esc(m.key)}"${state.sel===m.key?' class="sel"':''}>
    <td class="model"><button class="mname" data-tt="m|${esc(m.key)}">${esc(m.n)}</button></td>
    <td class="num">${m.cur?esc(m.cur):'<span class="na">—</span>'}</td>
    <td class="num">${m.pw?esc(m.pw):'<span class="na">—</span>'}</td>
    <td class="subs">${subs}</td>${dots}
    <td class="rm">${m.rm?esc(m.rm):''}</td></tr>`;
}
function sectionHTML(b,ms){
  const head=`<tr><th class="model" rowspan="2">型号</th><th class="h" rowspan="2" data-tt="c|cur">连续<br>电流</th><th class="h" rowspan="2" data-tt="c|pw">适合的<br>功率范围</th><th class="h" rowspan="2" data-tt="c|subs">可用来代替<br>其它产品</th><th class="gb" colspan="5">基本特点</th><th class="gs" colspan="7">特殊点</th><th rowspan="2">备注</th></tr>
  <tr>${FEATS.map(f=>`<th class="f" data-tt="f|${f.k}">${f.s}</th>`).join('')}</tr>`;
  return `<section class="brand" id="b-${b.id}"><div class="bhead"><h2><i style="background:${b.color}"></i>${esc(b.name)}</h2><span class="cnt">${ms.length} 个型号</span>${b.ap?`<span class="ap">适用：${esc(b.ap)}</span>`:''}</div>
  <div class="tw"><table><thead>${head}</thead><tbody>${ms.map(rowHTML).join('')}</tbody></table></div></section>`;
}
function render(){
  hideTip();
  const q=state.q.trim();
  const ok=q?new Set(results().map(r=>r.m)):null;
  let html='',shown=0;
  BR.forEach(b=>{
    if(state.brand!=='all'&&state.brand!==b.id) return;
    const ms=b.models.filter(m=>(!ok||ok.has(m))&&[...state.feats].every(k=>m.f.includes(k)));
    if(ms.length){shown+=ms.length;html+=sectionHTML(b,ms);}
  });
  $('#sections').innerHTML=html||'<div class="empty">没有找到匹配的型号。可以换个关键词，或点击上方“清除全部筛选”。<br>试试 SX440、R450、EA16、PMG。</div>';
  $('#count').textContent=`显示 ${shown} / ${ALL.length} 个型号`;
  $('#clear').hidden=!(q||state.brand!=='all'||state.feats.size);
  $('#qx').hidden=!q;
  renderFilters();
}
function renderFilters(){
  $('#brandRow').innerHTML='<span class="lbl">品牌</span>'+
    `<button class="fchip${state.brand==='all'?' on':''}" data-bf="all">全部<small>${ALL.length}</small></button>`+
    BR.map(b=>`<button class="fchip${state.brand===b.id?' on':''}" data-bf="${b.id}">${esc(b.name.replace(' AVR',''))}<small>${b.models.length}</small></button>`).join('');
  $('#featRow').innerHTML='<span class="lbl">按功能筛选</span>'+
    FEATS.map(f=>`<button class="fchip${f.g==='s'?' sp':''}${state.feats.has(f.k)?' on':''}" data-ff="${f.k}" data-tt="f|${f.k}">${esc(f.n)}</button>`).join('');
}

/* ---------- tooltip ---------- */
const tip=$('#tip');
function ttHTML(t){
  const [kind,a,b]=t.split('|');
  if(kind==='f'){const f=FMAP[a];return `<b>${esc(f.n)}</b>${esc(f.d)}`}
  if(kind==='c'){return `<b>${esc(COLS[a].n)}</b>${esc(COLS[a].d)}`}
  if(kind==='d'){const m=MAP.get(a),f=FMAP[b],lv=m.lv&&m.lv[b];return `<b>${esc(m.n)} · ${esc(f.n)}${lv?'（'+esc(lv)+'）':''}</b>${esc(f.d)}`}
  if(kind==='m'){const m=MAP.get(a);return `<b>${esc(m.n)}</b>${esc(m.cur||'电流未标注')} · ${esc(m.pw||'功率未标注')} · ${m.f.length} 项功能<br>点击查看知识点`}
  if(kind==='u'){return `<b>${esc(a)}</b>该型号未单独收录在表中`}
  return '';
}
function showTip(el){
  const html=ttHTML(el.getAttribute('data-tt')); if(!html) return;
  tip.innerHTML=html; tip.classList.add('show');
  const r=el.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight;
  let x=Math.min(Math.max(8,r.left+r.width/2-tw/2),innerWidth-tw-8);
  let y=r.bottom+8; if(y+th>innerHeight-8) y=Math.max(8,r.top-th-8);
  tip.style.left=x+'px'; tip.style.top=y+'px';
}
function hideTip(){tip.classList.remove('show')}
document.addEventListener('mouseover',e=>{const el=e.target.closest('[data-tt]');if(el)showTip(el)});
document.addEventListener('mouseout',e=>{if(e.target.closest('[data-tt]'))hideTip()});
document.addEventListener('focusin',e=>{const el=e.target.closest('[data-tt]');if(el)showTip(el)});
document.addEventListener('focusout',hideTip);
addEventListener('scroll',hideTip,{passive:true});

/* ---------- panel ---------- */
const panel=$('#panel');
function openPanel(html){panel.innerHTML=html;panel.scrollTop=0;panel.classList.add('open');panel.setAttribute('aria-hidden','false');hideTip()}
function closePanel(){panel.classList.remove('open');panel.setAttribute('aria-hidden','true');state.sel=null;document.querySelectorAll('tr.sel').forEach(r=>r.classList.remove('sel'))}
const closeBtn='<button class="xbtn" data-close aria-label="关闭"><svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 2l8 8M10 2l-8 8"/></svg></button>';
function subChip(s){const k=BYN.get(norm(s));return k?`<button class="chip known" data-om="${esc(k.key)}">${esc(s)}</button>`:`<span class="chip unk">${esc(s)}</span>`}
function modelPanel(m){
  const sup=FEATS.filter(f=>m.f.includes(f.k)),non=FEATS.filter(f=>!m.f.includes(f.k));
  const rev=ALL.filter(x=>x!==m&&x.subs.some(s=>norm(s)===norm(m.n)));
  const diffs=m.subs.map(s=>BYN.get(norm(s))).filter(Boolean).map(o=>{
    if(!m.f.length||!o.f.length) return `<li><b>${esc(o.n)}</b>：表中有一方没有标注功能，无法比较</li>`;
    const add=m.f.filter(k=>!o.f.includes(k)).map(k=>FMAP[k].n),miss=o.f.filter(k=>!m.f.includes(k)).map(k=>FMAP[k].n);
    const p=[];if(add.length)p.push('多了 '+add.join('、'));if(miss.length)p.push('少了 '+miss.join('、'));
    return `<li><b>${esc(o.n)}</b>：${p.length?esc(p.join('；')):'表中勾选的功能一致'}</li>`;
  });
  return `<div class="pin"><div class="ph"><div><div class="eyebrow">${esc(m.brand.name)}${m.ap?' · '+esc(m.ap):''}</div><h3>${esc(m.n)}</h3></div>${closeBtn}</div>
  <div class="spec"><div><span>连续电流</span><b>${esc(m.cur||'—')}</b></div><div><span>功率范围</span><b>${esc(m.pw||'—')}</b></div><div><span>已标功能</span><b>${m.f.length} / ${FEATS.length}</b></div></div>
  <h4>可用来代替</h4>${m.subs.length?`<div class="chips big">${m.subs.map(subChip).join('')}</div>`:`<p class="na">${m.noSub?'表中标注：无':'表中未标注'}</p>`}
  ${rev.length?`<h4>可被这些型号代替</h4><div class="chips big">${rev.map(x=>`<button class="chip known" data-om="${esc(x.key)}">${esc(x.n)}</button>`).join('')}</div>`:''}
  ${diffs.length?`<h4>用它代替时的差异</h4><ul class="dl">${diffs.join('')}</ul><p class="note">仅比较表中勾选的功能，选型前请再核对厂家资料。</p>`:''}
  <h4>功能知识点</h4>${sup.length?`<ul class="flist">${sup.map(f=>`<li class="${f.g==='s'?'sp':''}"><button data-of="${f.k}">${esc(f.n)}${m.lv&&m.lv[f.k]?'（'+esc(m.lv[f.k])+'）':''}</button><small>${esc(f.d)}</small></li>`).join('')}</ul>`:'<p class="na">表中没有标注这款产品的功能特点。</p>'}
  ${sup.length&&non.length?`<h4>表中未勾选</h4><div class="mut">${non.map(f=>`<span data-tt="f|${f.k}">${esc(f.n)}</span>`).join('')}</div>`:''}
  ${m.rm?`<h4>备注</h4><p>${esc(m.rm)}</p>`:''}</div>`;
}
function featPanel(k){
  const f=FMAP[k],ms=ALL.filter(m=>m.f.includes(k));
  const groups=BR.map(b=>({b,ms:ms.filter(m=>m.brand===b)})).filter(g=>g.ms.length);
  return `<div class="pin"><div class="ph"><div><div class="eyebrow">${f.g==='b'?'基本特点':'特殊点'}</div><h3 class="sf">${esc(f.n)}</h3></div>${closeBtn}</div>
  <p style="margin-top:14px">${esc(f.d)}</p>
  <h4 class="${f.g==='s'?'sp':''}">表中支持的型号（${ms.length}）</h4>
  ${groups.map(g=>`<div class="pgroup"><div class="eyebrow">${esc(g.b.name)}</div><div class="chips big">${g.ms.map(m=>`<button class="chip known" data-om="${esc(m.key)}">${esc(m.n)}</button>`).join('')}</div></div>`).join('')}
  <p class="note">功能说明为通用解释，具体以厂家资料为准。</p></div>`;
}
function openModel(key,scroll){
  const m=MAP.get(key); if(!m) return;
  state.sel=key; openPanel(modelPanel(m));
  document.querySelectorAll('tr.sel').forEach(r=>r.classList.remove('sel'));
  const tr=document.querySelector(`tr[data-m="${CSS.escape(key)}"]`);
  if(tr){tr.classList.add('sel');if(scroll)tr.scrollIntoView({block:'start',behavior:'smooth'})}
}
function openFeat(k){state.sel=null;document.querySelectorAll('tr.sel').forEach(r=>r.classList.remove('sel'));openPanel(featPanel(k))}

/* ---------- dropdown ---------- */
const dd=$('#dd'),qi=$('#q');let act=-1,autoT;
function buildDD(){
  const q=state.q.trim(),nq=norm(q);
  if(!q){dd.hidden=true;return}
  const rs=results().slice(0,7);
  const fs=nq.length>=2?FEATS.filter(f=>norm(f.n).includes(nq)).slice(0,2):[];
  let h='';
  if(rs.length){h+='<div class="lab">型号</div>'+rs.map(r=>`<button class="sug" role="option" data-om="${esc(r.m.key)}" data-scroll="1"><span class="nm">${esc(r.m.n)}</span><span class="br">${esc(r.m.brand.name)}</span>${r.why?`<span class="why">${esc(r.why)}</span>`:''}</button>`).join('')}
  if(fs.length){h+='<div class="lab">功能知识点</div>'+fs.map(f=>`<button class="sug" role="option" data-of="${f.k}"><span class="nm" style="font-family:var(--f-body)">${esc(f.n)}</span><span class="br">${ALL.filter(m=>m.f.includes(f.k)).length} 个型号支持</span></button>`).join('')}
  if(!h) h='<div class="none">没有匹配的型号。试试 SX440、R450 或 EA16。</div>';
  dd.innerHTML=h;dd.hidden=false;act=-1;
}
function moveAct(d){
  const items=[...dd.querySelectorAll('.sug')];if(!items.length)return;
  act=(act+d+items.length)%items.length;
  items.forEach((x,i)=>x.classList.toggle('act',i===act));
  items[act].scrollIntoView({block:'nearest'});
}
function autoOpen(){
  clearTimeout(autoT);
  autoT=setTimeout(()=>{
    if(!state.q.trim()) return;
    const rs=results();if(!rs.length) return;
    if(rs[0].s===100||rs.length===1){openModel(rs[0].m.key,true);dd.hidden=true}
  },450);
}
qi.addEventListener('input',()=>{state.q=qi.value;render();buildDD();autoOpen()});
qi.addEventListener('focus',()=>{if(state.q.trim())buildDD()});
qi.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();if(dd.hidden)buildDD();moveAct(1)}
  else if(e.key==='ArrowUp'){e.preventDefault();moveAct(-1)}
  else if(e.key==='Enter'){const items=dd.querySelectorAll('.sug');const t=items[act>=0?act:0];if(t){clearTimeout(autoT);t.click()}}
  else if(e.key==='Escape'){if(!dd.hidden)dd.hidden=true;else if(state.q){setQ('')}else closePanel()}
});
function setQ(v){qi.value=v;state.q=v;clearTimeout(autoT);render();buildDD()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.activeElement!==qi){closePanel()}});

/* ---------- clicks ---------- */
document.addEventListener('click',e=>{
  const t=e.target;
  if(!t.closest('#sw')) dd.hidden=true;
  let el;
  if(el=t.closest('[data-close]')){closePanel();return}
  if(el=t.closest('[data-om]')){openModel(el.dataset.om,true);dd.hidden=true;return}
  if(el=t.closest('[data-of]')){openFeat(el.dataset.of);dd.hidden=true;return}
  if(el=t.closest('[data-hint]')){setQ(el.dataset.hint);autoOpen();return}
  if(el=t.closest('[data-bf]')){state.brand=el.dataset.bf;render();return}
  if(el=t.closest('[data-ff]')){const k=el.dataset.ff;state.feats.has(k)?state.feats.delete(k):state.feats.add(k);render();return}
  if(el=t.closest('.chip[data-sub]')){openModel(el.dataset.sub,false);return}
  if(el=t.closest('th.f')){openFeat(el.dataset.tt.split('|')[1]);return}
  if(el=t.closest('tr[data-m]')){openModel(el.dataset.m,false);return}
});
$('#qx').addEventListener('click',()=>{setQ('');qi.focus()});
$('#clear').addEventListener('click',()=>{state.brand='all';state.feats.clear();setQ('')});
render();
</script>

</body></html>
